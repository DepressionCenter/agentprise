name: Suggest an improvement
description: Ask for something new or different in the Agentprise app.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for ideas about the Agentprise app itself. To share an assistant you made, use the **Send an assistant to the Library** form instead.

  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
      placeholder: Let me pick a color for the assistant's picture instead of always blue.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: How would that help you?
      description: Tell us what you are trying to get done. It helps us find the best way to do it.
      placeholder: Our team has three assistants and they all look the same in Copilot.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A sketch or a screenshot of another app that does it is welcome. Drag it into this box.
