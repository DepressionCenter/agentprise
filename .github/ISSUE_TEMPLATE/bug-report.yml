name: Something is not working
description: Tell us about a problem with the Agentprise app itself.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for problems with the Agentprise app: a button that does nothing, a download that fails, a page that looks wrong. If an assistant you made is giving odd answers in Copilot, Gemini, Claude, or ChatGPT, that is a question for that product, not for this app.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. If there was an error message, copy it here.
      placeholder: I chose Download app package and nothing happened.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: A .zip file should have been saved.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What did you do before it happened?
      description: List the steps so we can try the same thing.
      placeholder: |
        1. Opened the app and chose Create new.
        2. Filled in the name and the two text boxes.
        3. Chose Download app package.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where were you using the app?
      options:
        - On the website (code.depressioncenter.org/agentprise)
        - On my own computer
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Which browser?
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A screenshot helps a lot. Drag it into this box. Please do not include anything private.
