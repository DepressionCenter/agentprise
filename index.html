// declarative agent schema caps name at 100, description at 1,000, instructions at
// 8,000, and conversation starters at 12. The Agent Skills specification caps the
// skill name at 64 characters. ZIP caps guard against decompression bombs.

    name: 100,
    skillName: 64,
    description: 1000,
    instructions: 8000,
    welcome: 1000,
    starters: 12,
    starterText: 500,
    sharepointLinks: 20,
    sharepointLinkText: 2048,
    creatorText: 2048,
    copyrightText: 500,
    licenseText: 200,
    zipEntries: 200,
    zipEntryBytes: 10 * 1024 * 1024,
    zipTotalBytes: 50 * 1024 * 1024,
    iconBytes: 2 * 1024 * 1024
});

// ### Shared helpers ###
const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder("utf-8", { fatal: false });

/** Encodes a string as UTF-8 bytes. */
function toBytes(text) {
    return textEncoder.encode(text);
}

/** Decodes UTF-8 bytes to a string, replacing invalid sequences. */
function fromBytes(bytes) {
    return textDecoder.decode(bytes);
}

/** Returns true when the value is a plain object (not null, not an array). */
function isPlainObject(value) {
    return typeof value === "object" && value !== null && !Array.isArray(value);
}

/**
 * Coerces an untrusted value to a trimmed string no longer than max characters.
 * Non-strings become empty. A truncation adds a notice naming the field.
 */
function asText(value, max, field, notices) {
    if (typeof value !== "string") {
        return "";
    }
    let text = value.replace(/\r\n?/g, "\n").trim();
    if (text.length > max) {
        text = text.slice(0, max).trim();
        if (notices) {
            notices.push("The " + field + " was longer than " + max + " characters and was shortened.");
        }
    }
    return text;
}

/** Coerces an untrusted value to a boolean. Strings "true" and "false" are accepted. */
function asBool(value, fallback) {
    if (typeof value === "boolean") {
        return value;
    }
    if (value === "true") {
        return true;
    }
    if (value === "false") {
        return false;
    }
    return fallback;
}

/** Returns true for an absolute https URL with no spaces. */
function isHttpsUrl(value) {
    return typeof value === "string" && /^https:\/\/[^\s]+$/i.test(value);
}

/** Converts bytes to base64 without building one huge argument list. */
function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
}

/** Converts base64 to bytes. Returns null when the text is not valid base64. */
function base64ToBytes(text) {
    try {
        const binary = atob(text);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    } catch (error) {
        return null;
    }
}

/** Returns a copy of bytes so callers never share buffers with untrusted input. */
function copyBytes(bytes) {
    return new Uint8Array(bytes);
}

/** Returns true when two byte arrays have the same length and content. */
function bytesEqual(a, b) {
    if (!a || !b || a.length !== b.length) {
        return false;
    }
    for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) {
            return false;
        }
    }
    return true;
}

/**
 * Builds a file name safe for every desktop operating system from a display
 * name: letters, digits, spaces, dots, hyphens, and underscores only.
 */
function safeFileName(name, extension) {
    let base = String(name || "").replace(/[^A-Za-z0-9 ._-]+/g, " ").replace(/\s+/g, " ").trim();
    base = base.replace(/^[. ]+|[. ]+$/g, "");
    if (!base) {
        base = "agent";
    }
    return base.slice(0, 80) + extension;
}

/** Generates a random UUID with the platform CSPRNG. */
function newUuid() {
    return crypto.randomUUID();
}

// ### Agent model ###

/**
 * Creates an agent with every field at its default.
 * @returns {object} a fresh agent
 */
function createAgent() {
    return {
        version: APP_VERSION,
        name: "",
        description: "",
        welcome: "",
        instructions: "",
        starters: [],
        icon: null,
        sharepointLinks: [],
        copilot: {
            webSearch: true,
            teamsMessages: true,
            meetings: true,
            codeInterpreter: true,
            imageGeneration: true,
            preferMyFiles: false,
            appId: ""
        },
        creator: { name: "", website: "", privacy: "", terms: "" },
        copyright: "",
        license: DEFAULT_LICENSE
    };
}

/**
 * Derives the Agent Skills name from a display name: lowercase letters, digits,
 * and single hyphens, 1 to 64 characters, never starting or ending with a hyphen.
 * Accented letters lose their accents so "Cafe" and "Caf\u00e9" map to the same name.
 * @param {string} displayName
 * @returns {string} the skill name, or "agent" when nothing usable remains
 */
function toSkillName(displayName) {
    let name = String(displayName || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
    name = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    name = name.slice(0, LIMITS.skillName).replace(/-+$/g, "");
    return name || "agent";
}

/**
 * Copies an untrusted agent-shaped value into a clean agent, trimming text,
 * enforcing every limit, and dropping empty list items. Use it on anything read
 * from a file or from storage before it reaches the form.
 * @param {object} input any value
 * @returns {{agent: object, notices: string[]}} the clean agent and plain-language notes
 */
function normalizeAgent(input) {
    const notices = [];
    const agent = createAgent();
    const source = isPlainObject(input) ? input : {};

    agent.name = asText(source.name, LIMITS.name, "name", notices);
    agent.description = asText(source.description, LIMITS.description, "description", notices);
    agent.welcome = asText(source.welcome, LIMITS.welcome, "welcome message", notices);
    agent.instructions = asText(source.instructions, LIMITS.instructions, "instructions", notices);

    const starters = Array.isArray(source.starters) ? source.starters : [];
    agent.starters = starters
        .map(function (item) { return asText(item, LIMITS.starterText, "conversation starter", notices); })
        .filter(function (item) { return item.length > 0; });
    if (agent.starters.length > LIMITS.starters) {
        notices.push("Only the first " + LIMITS.starters + " conversation starters were kept.");
        agent.starters = agent.starters.slice(0, LIMITS.starters);
    }

    const links = Array.isArray(source.sharepointLinks) ? source.sharepointLinks : [];
    let droppedLinks = 0;
    agent.sharepointLinks = links
        .map(function (item) { return asText(item, LIMITS.sharepointLinkText, "SharePoint link", notices); })
        .filter(function (item) {
            if (!item) {
                return false;
            }
            if (!isHttpsUrl(item)) {
                droppedLinks += 1;
                return false;
            }
            return true;
        });
    if (droppedLinks > 0) {
        notices.push(droppedLinks + " SharePoint link(s) were removed because they were not https addresses.");
    }
    if (agent.sharepointLinks.length > LIMITS.sharepointLinks) {
        notices.push("Only the first " + LIMITS.sharepointLinks + " SharePoint links were kept.");
        agent.sharepointLinks = agent.sharepointLinks.slice(0, LIMITS.sharepointLinks);
    }

    if (isPlainObject(source.icon) && source.icon.bytes instanceof Uint8Array && source.icon.bytes.length > 0) {
        if (source.icon.bytes.length > LIMITS.iconBytes) {
            notices.push("The icon was larger than " + Math.round(LIMITS.iconBytes / 1024 / 1024) + " MB and was removed.");
        } else if (!pngDimensions(source.icon.bytes)) {
            notices.push("The icon was not a PNG image and was removed.");
        } else {
            agent.icon = { bytes: copyBytes(source.icon.bytes), mime: "image/png" };
        }
    }

    const copilot = isPlainObject(source.copilot) ? source.copilot : {};
    COPILOT_CAPABILITIES.forEach(function (cap) {
        agent.copilot[cap.key] = asBool(copilot[cap.key], agent.copilot[cap.key]);
    });
    agent.copilot.preferMyFiles = asBool(copilot.preferMyFiles, false);
    const appId = asText(copilot.appId, 64, "app id", notices);
    agent.copilot.appId = /^[0-9a-f-]{36}$/i.test(appId) ? appId.toLowerCase() : "";

    const creator = isPlainObject(source.creator) ? source.creator : {};
    agent.creator.name = asText(creator.name, LIMITS.creatorText, "creator name", notices);
    ["website", "privacy", "terms"].forEach(function (key) {
        const value = asText(creator[key], LIMITS.creatorText, "creator " + key + " link", notices);
        if (value && !isHttpsUrl(value)) {
            notices.push("The creator " + key + " link was removed because it was not an https address.");
            agent.creator[key] = "";
        } else {
            agent.creator[key] = value;
        }
    });

    agent.copyright = asText(source.copyright, LIMITS.copyrightText, "copyright line", notices);
    agent.license = asText(source.license, LIMITS.licenseText, "license", notices) || DEFAULT_LICENSE;

    return { agent: agent, notices: notices };
}

/**
 * Checks an agent for problems that block a download and warnings that only
 * affect some formats. Messages are plain English for the Check screen.
 * @param {object} agent a normalized agent
 * @returns {{problems: Array<{field: string, message: string}>, warnings: Array<{field: string, message: string}>}}
 */
function validateAgent(agent) {
    const problems = [];
    const warnings = [];
    if (!agent.name) {
        problems.push({ field: "name", message: "Give your agent a name." });
    }
    if (!agent.description) {
        problems.push({ field: "description", message: "Add a short description. Every product requires one." });
    }
    if (!agent.instructions) {
        problems.push({ field: "instructions", message: "Add instructions so the agent knows how to behave." });
    }
    if (agent.welcome) {
        warnings.push({ field: "welcome", message: "The Copilot app package can't carry a welcome message. The SharePoint file and the complete copy keep it." });
    }
    if (agent.copyright || agent.license !== DEFAULT_LICENSE) {
        warnings.push({ field: "copyright", message: "The Copilot app package can't carry a copyright line or license name. The other downloads keep them." });
    }
    if (agent.sharepointLinks.length > 0) {
        warnings.push({ field: "sharepointLinks", message: "SharePoint knowledge only works in Microsoft 365 Copilot. Other products ignore it." });
    }
    const missingCreator = ["name", "website", "privacy", "terms"].filter(function (key) { return !agent.creator[key]; });
    if (missingCreator.length > 0) {
        warnings.push({ field: "creator", message: "The Copilot app package needs a creator name and three links. Placeholder values will be used for the ones you left blank." });
    }
    if (!agent.icon) {
        warnings.push({ field: "icon", message: "No icon yet. Downloads will use the default icon." });
    }
    return { problems: problems, warnings: warnings };
}

// ### YAML frontmatter (subset) ###
// Only the syntax the bundle uses is supported: key: value scalars, quoted
// scalars, one nested mapping level, and block scalars written with | or |-.
// Everything else produces a warning and is skipped. Values are always strings.

/** Removes surrounding quotes and resolves the escapes the writer produces. */
function parseYamlScalar(raw) {
    const text = raw.trim();
    if (text.startsWith("\"") && text.endsWith("\"") && text.length >= 2) {
        return text.slice(1, -1).replace(/\\(["\\nrt])/g, function (match, code) {
            if (code === "n") { return "\n"; }
            if (code === "r") { return "\r"; }
            if (code === "t") { return "\t"; }
            return code;
        });
    }
    if (text.startsWith("'") && text.endsWith("'") && text.length >= 2) {
        return text.slice(1, -1).replace(/''/g, "'");
    }
    // A hash starts a comment only when preceded by whitespace.
    return text.replace(/\s+#.*$/, "").trim();
}

/** Returns the number of leading spaces on a line. */
function indentOf(line) {
    return line.length - line.replace(/^ +/, "").length;
}

/**
 * Splits text into frontmatter data and body. Windows line endings are accepted.
 * @param {string} text a SKILL.md file
 * @returns {{data: object, body: string, warnings: string[]}}
 */
function parseFrontmatter(text) {
    const warnings = [];
    const normalized = String(text || "").replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
    const lines = normalized.split("\n");
    if (lines[0] !== "---") {
        return { data: {}, body: normalized, warnings: warnings };
    }
    let end = -1;
    for (let i = 1; i < lines.length; i++) {
        if (lines[i] === "---" || lines[i] === "...") {
            end = i;
            break;
        }
    }
    if (end < 0) {
        warnings.push("The frontmatter never closed, so the whole file was treated as instructions.");
        return { data: {}, body: normalized, warnings: warnings };
    }
    const data = {};
    const headerLines = lines.slice(1, end);
    let i = 0;

    function readBlock(keyIndent, keepTrailing) {
        const collected = [];
        const contentIndent = keyIndent + 2;
        while (i < headerLines.length) {
            const line = headerLines[i];
            if (line.trim() === "") {
                collected.push("");
                i += 1;
                continue;
            }
            if (indentOf(line) < contentIndent) {
                break;
            }
            collected.push(line.slice(contentIndent));
            i += 1;
        }
        // Blank lines at the end belong to the chomping rule, not the content.
        while (collected.length > 0 && collected[collected.length - 1] === "") {
            collected.pop();
        }
        const value = collected.join("\n");
        return keepTrailing ? value + "\n" : value;
    }

    function readEntry(line, indent, target) {
        const match = line.slice(indent).match(/^([A-Za-z0-9_.-]+):(?:\s(.*))?$/);
        if (!match) {
            warnings.push("Skipped a frontmatter line that is not a key and value: " + line.trim().slice(0, 60));
            i += 1;
            return;
        }
        const key = match[1];
        const rest = (match[2] || "").trim();
        i += 1;
        if (rest === "|" || rest === "|-" || rest === "|+") {
            target[key] = readBlock(indent, rest !== "|-");
            return;
        }
        if (rest === ">" || rest === ">-") {
            warnings.push("Folded text for \"" + key + "\" is not supported and was skipped.");
            readBlock(indent, false);
            return;
        }
        if (rest === "" && indent === 0) {
            const nested = {};
            while (i < headerLines.length) {
                const next = headerLines[i];
                if (next.trim() === "" || next.trim().startsWith("#")) {
                    i += 1;
                    continue;
                }
                const nextIndent = indentOf(next);
                if (nextIndent === 0) {
                    break;
                }
                if (next.trim().startsWith("- ")) {
                    warnings.push("Lists under \"" + key + "\" are not supported and were skipped.");
                    i += 1;
                    continue;
                }
                readEntry(next, nextIndent, nested);
            }
            target[key] = nested;
            return;
        }
        target[key] = parseYamlScalar(rest);
    }

    while (i < headerLines.length) {
        const line = headerLines[i];
        if (line.trim() === "" || line.trim().startsWith("#")) {
            i += 1;
            continue;
        }
        const indent = indentOf(line);
        if (indent !== 0) {
            warnings.push("Skipped an indented frontmatter line with no parent key.");
            i += 1;
            continue;
        }
        if (line.trim().startsWith("- ")) {
            warnings.push("Top-level lists in frontmatter are not supported and were skipped.");
            i += 1;
            continue;
        }
        readEntry(line, 0, data);
    }
    const body = lines.slice(end + 1).join("\n");
    return { data: data, body: body, warnings: warnings };
}

/** Quotes a scalar when YAML would otherwise misread it. */
function formatYamlScalar(value) {
    const text = String(value);
    if (text === "") {
        return "\"\"";
    }
    const looksSpecial = /^[-?:,\[\]{}#&*!|>'"%@`]/.test(text) ||
        /: |\s#|#/.test(text) ||
        /^\s|\s$/.test(text) ||
        /^(true|false|yes|no|on|off|null|~)$/i.test(text) ||
        /^[-+]?(\d[\d_]*\.?\d*([eE][-+]?\d+)?|\.\d+|0x[0-9a-fA-F]+|0o[0-7]+)$/.test(text) ||
        /^\d{4}-\d{2}-\d{2}/.test(text) ||
        text.endsWith(":");
    if (!looksSpecial) {
        return text;
    }
    return "\"" + text.replace(/\\/g, "\\\\").replace(/"/g, "\\\"").replace(/\t/g, "\\t").replace(/\r/g, "\\r") + "\"";
}

/** Writes one key, choosing a block scalar for multi-line values. */
function formatYamlEntry(key, value, indent) {
    const pad = " ".repeat(indent);
    if (isPlainObject(value)) {
        const lines = [pad + key + ":"];
        Object.keys(value).forEach(function (childKey) {
            lines.push(formatYamlEntry(childKey, value[childKey], indent + 2));
        });
        return lines.join("\n");
    }
    const text = String(value === null || value === undefined ? "" : value);
    if (text.indexOf("\n") >= 0) {
        const keepTrailing = text.endsWith("\n");
        const content = keepTrailing ? text.slice(0, -1) : text;
        const blockLines = content.split("\n").map(function (line) {
            return line === "" ? "" : pad + "  " + line;
        });
        return pad + key + ": " + (keepTrailing ? "|" : "|-") + "\n" + blockLines.join("\n");
    }
    return pad + key + ": " + formatYamlScalar(text);
}

/**
 * Writes frontmatter and a body as one Markdown document that the parser above
 * and standard YAML readers both accept.
 * @param {object} data string values or one level of nested string values
 * @param {string} body Markdown body
 * @returns {string}
 */
function stringifyFrontmatter(data, body) {
    const lines = ["---"];
    Object.keys(data).forEach(function (key) {
        lines.push(formatYamlEntry(key, data[key], 0));
    });
    lines.push("---");
    return lines.join("\n") + "\n" + String(body || "");
}

// ### PNG header check ###

/**
 * Reads the width and height from a PNG header without decoding the image.
 * @param {Uint8Array} bytes
 * @returns {{width: number, height: number}|null} null when the bytes are not a PNG
 */
function pngDimensions(bytes) {
    if (!(bytes instanceof Uint8Array) || bytes.length < 24) {
        return null;
    }
    for (let i = 0; i < PNG_SIGNATURE.length; i++) {
        if (bytes[i] !== PNG_SIGNATURE[i]) {
            return null;
        }
    }
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (fromBytes(bytes.subarray(12, 16)) !== "IHDR") {
        return null;
    }
    const width = view.getUint32(16, false);
    const height = view.getUint32(20, false);
    if (width === 0 || height === 0) {
        return null;
    }
    return { width: width, height: height };
}

// ### ZIP reader and writer ###
// The writer stores entries uncompressed. The reader accepts stored and deflated
// entries, treats every header field as untrusted, and refuses archives that
// could escape a folder or exhaust memory.

/** Error type for every ZIP problem the reader reports. */
class ZipError extends Error {
    constructor(message) {
        super(message);
        this.name = "ZipError";
    }
}

const CRC_TABLE = (function () {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[n] = c >>> 0;
    }
    return table;
})();

/** Computes the CRC-32 of a byte array as an unsigned 32-bit number. */
function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
        crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

/** Returns the DOS time and date fields for the current moment. */
function dosDateTime() {
    const now = new Date();
    const year = Math.max(1980, now.getFullYear());
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const date = ((year - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    return { time: time, date: date };
}

/**
 * Builds a ZIP archive with the store method.
 * @param {Array<{name: string, bytes: Uint8Array}>} entries file names use forward slashes
 * @returns {Uint8Array}
 */
function zipWrite(entries) {
    const stamp = dosDateTime();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    entries.forEach(function (entry) {
        const nameBytes = toBytes(entry.name);
        const data = entry.bytes instanceof Uint8Array ? entry.bytes : toBytes(String(entry.bytes));
        const crc = crc32(data);
        const local = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034B50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true);
        lv.setUint16(8, 0, true);
        lv.setUint16(10, stamp.time, true);
        lv.setUint16(12, stamp.date, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true);
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        local.set(nameBytes, 30);
        localParts.push(local, data);

        const central = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(central.buffer);
        cv.setUint32(0, 0x02014B50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, stamp.time, true);
        cv.setUint16(14, stamp.date, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        central.set(nameBytes, 46);
        centralParts.push(central);
        offset += local.length + data.length;
    });
    const centralSize = centralParts.reduce(function (sum, part) { return sum + part.length; }, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);
    const total = offset + centralSize + end.length;
    const out = new Uint8Array(total);
    let cursor = 0;
    localParts.concat(centralParts, [end]).forEach(function (part) {
        out.set(part, cursor);
        cursor += part.length;
    });
    return out;
}

/** Rejects entry names that could escape the target folder or confuse a reader. */
function checkZipEntryName(name) {
    if (!name || name.length > 512) {
        throw new ZipError("The file contains an entry with an empty or very long name.");
    }
    if (name.indexOf("\\") >= 0 || name.startsWith("/") || /^[A-Za-z]:/.test(name) || name.indexOf("\u0000") >= 0) {
        throw new ZipError("The file contains an entry with an unsafe path and was not opened.");
    }
    const parts = name.split("/");
    if (parts.some(function (part) { return part === ".." || part === "."; })) {
        throw new ZipError("The file contains an entry that points outside its folder and was not opened.");
    }
}

/**
 * Inflates raw deflate data, stopping as soon as the output passes the size the
 * archive declared so a mislabeled bomb cannot fill memory.
 */
async function inflateRaw(bytes, expectedSize) {
    if (typeof DecompressionStream === "undefined") {
        throw new ZipError("This browser can't open compressed files. Try a current version of Chrome, Edge, Firefox, or Safari.");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const reader = stream.getReader();
    const chunks = [];
    let total = 0;
    try {
        while (true) {
            const step = await reader.read();
            if (step.done) {
                break;
            }
            total += step.value.length;
            if (total > expectedSize) {
                await reader.cancel();
                throw new ZipError("An entry in the file is larger than it claims to be, so the file was not opened.");
            }
            chunks.push(step.value);
        }
    } catch (error) {
        if (error instanceof ZipError) {
            throw error;
        }
        throw new ZipError("An entry in the file could not be decompressed.");
    }
    const out = new Uint8Array(total);
    let cursor = 0;
    chunks.forEach(function (chunk) {
        out.set(chunk, cursor);
        cursor += chunk.length;
    });
    return out;
}

/**
 * Reads a ZIP archive into a map of entry name to bytes. Directory entries are
 * skipped. Throws ZipError for anything malformed, unsafe, or over the limits.
 * @param {Uint8Array} bytes
 * @returns {Promise<Map<string, Uint8Array>>}
 */
async function zipRead(bytes) {
    if (!(bytes instanceof Uint8Array) || bytes.length < 22) {
        throw new ZipError("This is not a ZIP file.");
    }
    if (bytes.length > LIMITS.zipTotalBytes) {
        throw new ZipError("The file is larger than " + Math.round(LIMITS.zipTotalBytes / 1024 / 1024) + " MB, which is the most this app opens.");
    }
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let endOffset = -1;
    const searchFloor = Math.max(0, bytes.length - 22 - 65535);
    for (let i = bytes.length - 22; i >= searchFloor; i--) {
        if (view.getUint32(i, true) === 0x06054B50) {
            endOffset = i;
            break;
        }
    }
    if (endOffset < 0) {
        throw new ZipError("This is not a ZIP file.");
    }
    const entryCount = view.getUint16(endOffset + 10, true);
    const centralSize = view.getUint32(endOffset + 12, true);
    const centralOffset = view.getUint32(endOffset + 16, true);
    if (entryCount > LIMITS.zipEntries) {
        throw new ZipError("The file holds more than " + LIMITS.zipEntries + " entries, which is more than this app opens.");
    }
    if (centralOffset + centralSize > endOffset) {
        throw new ZipError("The file's directory is damaged.");
    }
    const entries = new Map();
    let cursor = centralOffset;
    let totalBytes = 0;
    for (let n = 0; n < entryCount; n++) {
        if (cursor + 46 > endOffset || view.getUint32(cursor, true) !== 0x02014B50) {
            throw new ZipError("The file's directory is damaged.");
        }
        const flags = view.getUint16(cursor + 8, true);
        const method = view.getUint16(cursor + 10, true);
        const crc = view.getUint32(cursor + 16, true);
        const compressedSize = view.getUint32(cursor + 20, true);
        const uncompressedSize = view.getUint32(cursor + 24, true);
        const nameLength = view.getUint16(cursor + 28, true);
        const extraLength = view.getUint16(cursor + 30, true);
        const commentLength = view.getUint16(cursor + 32, true);
        const localOffset = view.getUint32(cursor + 42, true);
        const name = fromBytes(bytes.subarray(cursor + 46, cursor + 46 + nameLength));
        cursor += 46 + nameLength + extraLength + commentLength;

        if (compressedSize === 0xFFFFFFFF || uncompressedSize === 0xFFFFFFFF || localOffset === 0xFFFFFFFF) {
            throw new ZipError("64-bit ZIP files are not supported.");
        }
        if ((flags & 0x0001) !== 0) {
            throw new ZipError("Encrypted ZIP files are not supported.");
        }
        checkZipEntryName(name);
        if (name.endsWith("/")) {
            continue;
        }
        if (uncompressedSize > LIMITS.zipEntryBytes) {
            throw new ZipError("An entry in the file is larger than " + Math.round(LIMITS.zipEntryBytes / 1024 / 1024) + " MB, which is more than this app opens.");
        }
        totalBytes += uncompressedSize;
        if (totalBytes > LIMITS.zipTotalBytes) {
            throw new ZipError("The unpacked file would be larger than " + Math.round(LIMITS.zipTotalBytes / 1024 / 1024) + " MB, which is more than this app opens.");
        }
        if (localOffset + 30 > centralOffset || view.getUint32(localOffset, true) !== 0x04034B50) {
            throw new ZipError("The file's directory is damaged.");
        }
        const localNameLength = view.getUint16(localOffset + 26, true);
        const localExtraLength = view.getUint16(localOffset + 28, true);
        const dataStart = localOffset + 30 + localNameLength + localExtraLength;
        if (dataStart + compressedSize > centralOffset) {
            throw new ZipError("The file's directory is damaged.");
        }
        const raw = bytes.subarray(dataStart, dataStart + compressedSize);
        let data;
        if (method === 0) {
            if (compressedSize !== uncompressedSize) {
                throw new ZipError("The file's directory is damaged.");
            }
            data = copyBytes(raw);
        } else if (method === 8) {
            data = await inflateRaw(raw, uncompressedSize);
        } else {
            throw new ZipError("The file uses a compression method this app does not support.");
        }
        if (data.length !== uncompressedSize || crc32(data) !== crc) {
            throw new ZipError("An entry in the file is damaged (its checksum does not match).");
        }
        entries.set(name, data);
    }
    return entries;
}

// ### Format helpers ###

/**
 * One-line notice for files that tolerate an extra key. It names the creator's
 * own copyright and license first, because the exported agent belongs to them,
 * then the app that wrote the file.
 */
function licenseNotice(agent) {
    const parts = [];
    if (agent.copyright) {
        parts.push(agent.copyright.replace(/\.?$/, "."));
    }
    parts.push("Licensed under " + agent.license + ".");
    parts.push("Made with Agentprise, free software under the GNU GPL v3.0 or later: " + APP_REPOSITORY_URL);
    return parts.join(" ");
}

/** Cuts text to max characters, recording a warning when something was lost. */
function truncateWithWarning(text, max, label, warnings) {
    if (text.length <= max) {
        return text;
    }
    warnings.push("The " + label + " was shortened to " + max + " characters for this format.");
    return text.slice(0, max).trim();
}

/** Reads a nested value safely from untrusted JSON. */
function readPath(object, path) {
    let current = object;
    for (let i = 0; i < path.length; i++) {
        if (!isPlainObject(current)) {
            return undefined;
        }
        current = current[path[i]];
    }
    return current;
}

/** Turns a PNG data URI from an untrusted file into icon bytes, or null. */
function iconFromDataUri(value, notices) {
    if (typeof value !== "string" || value === "") {
        return null;
    }
    if (!value.startsWith(PNG_DATA_URI_PREFIX)) {
        notices.push("The icon in the file is not a PNG image and was left out.");
        return null;
    }
    const bytes = base64ToBytes(value.slice(PNG_DATA_URI_PREFIX.length));
    if (!bytes || !pngDimensions(bytes)) {
        notices.push("The icon in the file could not be read and was left out.");
        return null;
    }
    return { bytes: bytes, mime: "image/png" };
}

/** Turns PNG bytes from an archive into an icon, or null with a notice. */
function iconFromBytes(bytes, notices) {
    if (!bytes) {
        return null;
    }
    if (!pngDimensions(bytes)) {
        notices.push("The icon in the file is not a PNG image and was left out.");
        return null;
    }
    return { bytes: copyBytes(bytes), mime: "image/png" };
}

/** Reads a ZIP for an importer, turning ZipError into a plain result. */
async function readArchiveForImport(bytes) {
    try {
        return { entries: await zipRead(bytes) };
    } catch (error) {
        if (error instanceof ZipError) {
            return { error: error.message };
        }
        throw error;
    }
}

/** Parses JSON from an untrusted file into a plain object, or returns null. */
function parseJsonObject(text) {
    try {
        const value = JSON.parse(text);
        return isPlainObject(value) ? value : null;
    } catch (error) {
        return null;
    }
}

/** Makes a readable display name from a skill name such as "pdf-processing". */
function humanizeSkillName(skillName) {
    return String(skillName || "").split("-").filter(Boolean).map(function (word) {
        return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(" ");
}

// ### Format: Microsoft 365 Copilot .agent file (SharePoint and Teams chats) ###
// Schema 0.2.0 is undocumented. The shape below matches a file exported by the
// SharePoint agent builder on 2026-10-09. The reader ignores keys it does not
// know, which is verified in a tenant, so two extra keys carry the license notice
// and the fields the format itself lacks.

/**
 * Writes the .agent JSON for SharePoint libraries and Teams chats. Lossless.
 * @param {object} agent a normalized agent
 * @returns {{fileName: string, text: string, warnings: string[]}}
 */
function msAgentExport(agent) {
    const warnings = [];
    const starters = {
        conversationStarterList: agent.starters.map(function (text) { return { text: text }; })
    };
    if (agent.welcome) {
        starters.welcomeMessage = { text: agent.welcome };
    }
    const definition = {
        name: agent.name,
        description: agent.description,
        instructions: agent.instructions,
        capabilities: [
            {
                name: "OneDriveAndSharePoint",
                items_by_sharepoint_ids: [],
                items_by_url: agent.sharepointLinks.map(function (url) { return { url: url }; })
            }
        ],
        behavior_overrides: {
            special_instructions: { discourage_model_knowledge: agent.copilot.preferMyFiles === true }
        }
    };
    const config = { conversationStarters: starters, gptDefinition: definition };
    if (agent.icon) {
        config.icon = PNG_DATA_URI_PREFIX + bytesToBase64(agent.icon.bytes);
    }
    const document = {
        _license: licenseNotice(agent),
        _agentprise: {
            version: APP_VERSION,
            display_name: agent.name,
            copilot: {
                web_search: agent.copilot.webSearch,
                teams_messages: agent.copilot.teamsMessages,
                meetings: agent.copilot.meetings,
                code_interpreter: agent.copilot.codeInterpreter,
                image_generation: agent.copilot.imageGeneration,
                app_id: agent.copilot.appId
            },
            creator: {
                name: agent.creator.name,
                website: agent.creator.website,
                privacy: agent.creator.privacy,
                terms: agent.creator.terms
            },
            copyright: agent.copyright,
            license: agent.license
        },
        schemaVersion: MS_AGENT_SCHEMA_VERSION,
        customCopilotConfig: config
    };
    return { fileName: safeFileName(agent.name, ".agent"), text: JSON.stringify(document, null, 2), warnings: warnings };
}

/**
 * Reads a .agent file. Files made in SharePoint lack the _agentprise key, so the
 * Copilot options fall back to their defaults.
 * @param {string} text file contents
 * @returns {{agent: object, notices: string[]}|{error: string}}
 */
function msAgentImport(text) {
    let parsed;
    try {
        parsed = JSON.parse(String(text));
    } catch (error) {
        return { error: "This file is not valid JSON, so it can't be opened as a Copilot agent." };
    }
    if (!isPlainObject(parsed) || !isPlainObject(parsed.customCopilotConfig)) {
        return { error: "This doesn't look like a Copilot .agent file. It has no customCopilotConfig section." };
    }
    const notices = [];
    const config = parsed.customCopilotConfig;
    const definition = isPlainObject(config.gptDefinition) ? config.gptDefinition : {};
    const starters = isPlainObject(config.conversationStarters) ? config.conversationStarters : {};
    const raw = {
        name: definition.name,
        description: definition.description,
        instructions: definition.instructions,
        welcome: readPath(starters, ["welcomeMessage", "text"]),
        starters: (Array.isArray(starters.conversationStarterList) ? starters.conversationStarterList : [])
            .map(function (item) { return isPlainObject(item) ? item.text : ""; }),
        sharepointLinks: [],
        copilot: {
            preferMyFiles: readPath(definition, ["behavior_overrides", "special_instructions", "discourage_model_knowledge"])
        },
        icon: iconFromDataUri(config.icon, notices)
    };
    let idOnlySources = 0;
    (Array.isArray(definition.capabilities) ? definition.capabilities : []).forEach(function (capability) {
        if (!isPlainObject(capability) || capability.name !== "OneDriveAndSharePoint") {
            return;
        }
        (Array.isArray(capability.items_by_url) ? capability.items_by_url : []).forEach(function (item) {
            if (isPlainObject(item)) {
                raw.sharepointLinks.push(item.url);
            }
        });
        idOnlySources += Array.isArray(capability.items_by_sharepoint_ids) ? capability.items_by_sharepoint_ids.length : 0;
    });
    if (idOnlySources > 0) {
        notices.push(idOnlySources + " SharePoint source(s) were stored by ID, which this app can't carry. Add them again as links.");
    }
    const extra = isPlainObject(parsed._agentprise) ? parsed._agentprise : null;
    if (extra) {
        const copilot = isPlainObject(extra.copilot) ? extra.copilot : {};
        raw.copilot.webSearch = copilot.web_search;
        raw.copilot.teamsMessages = copilot.teams_messages;
        raw.copilot.meetings = copilot.meetings;
        raw.copilot.codeInterpreter = copilot.code_interpreter;
        raw.copilot.imageGeneration = copilot.image_generation;
        raw.copilot.appId = copilot.app_id;
        raw.creator = extra.creator;
        raw.copyright = extra.copyright;
        raw.license = extra.license;
    }
    const result = normalizeAgent(raw);
    return { agent: result.agent, notices: notices.concat(result.notices) };
}

// ### Format: Agentprise bundle (Agent Skill ZIP for Gemini and Claude) ###
// The bundle is a valid Agent Skill folder inside a ZIP. Fields the skill
// standard lacks live under metadata as flat strings, so standard readers keep
// working and this app loses nothing on the way back.

/** Frontmatter for SKILL.md. Every metadata value is a string by design. */
function bundleFrontmatter(agent, skillName) {
    const metadata = {};
    metadata[META.version] = APP_VERSION;
    metadata[META.displayName] = agent.name;
    metadata[META.welcome] = agent.welcome;
    metadata[META.starters] = agent.starters.join("\n");
    metadata[META.sharepoint] = agent.sharepointLinks.join("\n");
    metadata[META.webSearch] = String(agent.copilot.webSearch);
    metadata[META.teamsMessages] = String(agent.copilot.teamsMessages);
    metadata[META.meetings] = String(agent.copilot.meetings);
    metadata[META.codeInterpreter] = String(agent.copilot.codeInterpreter);
    metadata[META.imageGeneration] = String(agent.copilot.imageGeneration);
    metadata[META.preferMyFiles] = String(agent.copilot.preferMyFiles);
    metadata[META.appId] = agent.copilot.appId;
    metadata[META.creatorName] = agent.creator.name;
    metadata[META.creatorWebsite] = agent.creator.website;
    metadata[META.creatorPrivacy] = agent.creator.privacy;
    metadata[META.creatorTerms] = agent.creator.terms;
    metadata[META.copyright] = agent.copyright;
    return {
        name: skillName,
        description: agent.description || agent.name,
        license: agent.license + ". See LICENSE.txt.",
        metadata: metadata
    };
}

/** The short README that travels inside the bundle. */
function bundleReadme(agent) {
    const lines = [
        "<!--",
        agent.name,
        licenseNotice(agent),
        "-->",
        "",
        "# " + agent.name,
        "",
        agent.description || "",
        ""
    ];
    if (agent.creator.name) {
        lines.push("Made by " + agent.creator.name + (agent.creator.website ? " (" + agent.creator.website + ")" : "") + ".", "");
    }
    lines.push(
        "## How to use",
        "",
        "- Gemini: open Settings, then Skills, then Upload, and choose this ZIP file.",
        "- Claude: open Settings, then Capabilities, then Skills, and upload this ZIP file.",
        "- Microsoft 365 Copilot, ChatGPT, or to edit it: open this ZIP file at " + APP_SITE_URL,
        "",
        "SKILL.md holds the instructions. LICENSE.txt holds the license.",
        ""
    );
    return lines.join("\n");
}

/** LICENSE.txt for the bundle: the full GPL for the default, a notice otherwise. */
function bundleLicenseText(agent) {
    const head = agent.copyright ? agent.copyright + "\n\n" : "";
    if (agent.license === DEFAULT_LICENSE) {
        return head + "This work is licensed under the GNU General Public License v3.0 or later. The full text follows.\n\n" + GPL_TEXT;
    }
    const choice = LICENSE_CHOICES.find(function (item) { return item.id === agent.license; });
    const link = choice && choice.url ? " See " + choice.url : "";
    return head + "This work is licensed under " + agent.license + "." + link + "\n";
}

/**
 * Writes the bundle: a ZIP holding one skill folder with SKILL.md, icon.png,
 * LICENSE.txt, and README.md. Uploads unchanged to Gemini and Claude.
 * @param {object} agent a normalized agent
 * @returns {Promise<{fileName: string, bytes: Uint8Array, warnings: string[], skillName: string}>}
 */
async function bundleExport(agent) {
    const warnings = [];
    const skillName = toSkillName(agent.name);
    if (!agent.description) {
        warnings.push("The description is empty, so the name is used as the description.");
    }
    const skillMd = stringifyFrontmatter(bundleFrontmatter(agent, skillName), "\n" + agent.instructions + "\n");
    const entries = [{ name: skillName + "/SKILL.md", bytes: toBytes(skillMd) }];
    if (agent.icon) {
        entries.push({ name: skillName + "/icon.png", bytes: agent.icon.bytes });
    }
    entries.push({ name: skillName + "/LICENSE.txt", bytes: toBytes(bundleLicenseText(agent)) });
    entries.push({ name: skillName + "/README.md", bytes: toBytes(bundleReadme(agent)) });
    return { fileName: safeFileName(skillName, ".zip"), bytes: zipWrite(entries), warnings: warnings, skillName: skillName };
}

/**
 * Reads a SKILL.md file, from this app or from any Agent Skill. Metadata keys
 * this app does not know are ignored. Unknown top-level fields produce a notice.
 * @param {string} text file contents
 * @returns {{agent: object, notices: string[]}}
 */
function skillMdImport(text) {
    const parsed = parseFrontmatter(text);
    const notices = parsed.warnings.slice();
    const data = parsed.data;
    const meta = isPlainObject(data.metadata) ? data.metadata : {};
    const knownFields = ["name", "description", "license", "compatibility", "metadata", "allowed-tools"];
    Object.keys(data).forEach(function (key) {
        if (knownFields.indexOf(key) < 0) {
            notices.push("The frontmatter field \"" + key + "\" is not part of the Agent Skills standard and was ignored.");
        }
    });
    const skillName = typeof data.name === "string" ? data.name.trim() : "";
    if (!skillName) {
        notices.push("The file has no name in its frontmatter, so you will need to add one.");
    } else if (skillName !== toSkillName(skillName)) {
        notices.push("The skill name \"" + skillName + "\" doesn't follow the Agent Skills rules. It will be saved as \"" + toSkillName(skillName) + "\".");
    }
    const splitLines = function (value) {
        return typeof value === "string" ? value.split("\n") : [];
    };
    let license = typeof data.license === "string" ? data.license : "";
    const licenseMatch = license.match(/^(.*?)\.\s+See LICENSE\.txt\.?$/);
    if (licenseMatch) {
        license = licenseMatch[1];
    }
    const raw = {
        name: typeof meta[META.displayName] === "string" && meta[META.displayName] ? meta[META.displayName] : humanizeSkillName(skillName),
        description: data.description,
        instructions: parsed.body.replace(/^\n+/, "").replace(/\s+$/, ""),
        welcome: meta[META.welcome],
        starters: splitLines(meta[META.starters]),
        sharepointLinks: splitLines(meta[META.sharepoint]),
        copilot: {
            webSearch: meta[META.webSearch],
            teamsMessages: meta[META.teamsMessages],
            meetings: meta[META.meetings],
            codeInterpreter: meta[META.codeInterpreter],
            imageGeneration: meta[META.imageGeneration],
            preferMyFiles: meta[META.preferMyFiles],
            appId: meta[META.appId]
        },
        creator: {
            name: meta[META.creatorName],
            website: meta[META.creatorWebsite],
            privacy: meta[META.creatorPrivacy],
            terms: meta[META.creatorTerms]
        },
        copyright: meta[META.copyright],
        license: license
    };
    const result = normalizeAgent(raw);
    return { agent: result.agent, notices: notices.concat(result.notices) };
}

/**
 * Reads a bundle or any Agent Skill ZIP. SKILL.md may sit at the root or inside
 * one folder; the shortest path wins when there are several.
 * @param {Uint8Array} bytes
 * @returns {Promise<{agent: object, notices: string[]}|{error: string}>}
 */
async function bundleImport(bytes) {
    const archive = await readArchiveForImport(bytes);
    if (archive.error) {
        return { error: archive.error };
    }
    const entries = archive.entries;
    const candidates = Array.from(entries.keys()).filter(function (name) {
        return name === "SKILL.md" || name.endsWith("/SKILL.md");
    }).sort(function (a, b) { return a.length - b.length; });
    if (candidates.length === 0) {
        return { error: "This ZIP has no SKILL.md inside, so it isn't an agent skill or an Agentprise bundle." };
    }
    const skillPath = candidates[0];
    const folder = skillPath.slice(0, skillPath.length - "SKILL.md".length);
    const result = skillMdImport(fromBytes(entries.get(skillPath)));
    const notices = result.notices;
    const agent = result.agent;
    const iconBytes = entries.get(folder + "icon.png");
    if (iconBytes) {
        const normalized = normalizeAgent({ icon: iconFromBytes(iconBytes, notices) });
        agent.icon = normalized.agent.icon;
        notices.push.apply(notices, normalized.notices);
    }
    return { agent: agent, notices: notices };
}

// ### Format: Teams app package (the Copilot app) ###
// A ZIP with manifest.json, declarativeAgent_0.json, color.png, and outline.png.
// Both JSON files are schema-validated and reject unknown keys, so nothing extra
// goes in them. The welcome message has no home here and is reported as lost.

/** Builds the Teams manifest version. Later exports sort higher so updates install. */
function teamsManifestVersion() {
    const now = new Date();
    const pad = function (n) { return String(n).padStart(2, "0"); };
    const date = String(now.getUTCFullYear()) + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate());
    const time = pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds());
    return "1." + date + "." + time;
}

/**
 * Writes the Teams app package. The caller supplies the two icon files already
 * sized for Microsoft (192 by 192 color, 32 by 32 white-on-transparent outline).
 * Side effect: when the agent has no app id yet, one is generated and stored on
 * the agent so later exports update the same app instead of creating a new one.
 * @param {object} agent a normalized agent
 * @param {{color: Uint8Array, outline: Uint8Array}} icons PNG bytes
 * @returns {Promise<{fileName: string, bytes: Uint8Array, warnings: string[], appId: string}>}
 */
async function teamsZipExport(agent, icons) {
    const warnings = [];
    if (!icons || !pngDimensions(icons.color) || !pngDimensions(icons.outline)) {
        throw new Error("The Teams package needs a color icon and an outline icon as PNG bytes.");
    }
    const colorSize = pngDimensions(icons.color);
    const outlineSize = pngDimensions(icons.outline);
    if (colorSize.width !== 192 || colorSize.height !== 192 || outlineSize.width !== 32 || outlineSize.height !== 32) {
        throw new Error("The Teams package needs a 192 by 192 color icon and a 32 by 32 outline icon.");
    }
    if (!agent.copilot.appId) {
        agent.copilot.appId = newUuid();
    }
    const appId = agent.copilot.appId;
    if (agent.welcome) {
        warnings.push("The Copilot app package can't carry the welcome message, so it was left out.");
    }
    if (agent.copyright || agent.license !== DEFAULT_LICENSE) {
        warnings.push("The Copilot app package can't carry the copyright line or license name, so they were left out.");
    }
    const creator = {};
    const placeholdersUsed = [];
    ["name", "website", "privacy", "terms"].forEach(function (key) {
        if (agent.creator[key]) {
            creator[key] = agent.creator[key];
        } else {
            creator[key] = CREATOR_PLACEHOLDERS[key];
            placeholdersUsed.push(key);
        }
    });
    if (placeholdersUsed.length > 0) {
        warnings.push("Placeholder values were used for the creator " + placeholdersUsed.join(", ") + ". Fill in About you to replace them.");
    }
    const developerName = truncateWithWarning(creator.name, TEAMS_DEVELOPER_NAME_MAX, "creator name", warnings);
    const shortName = truncateWithWarning(agent.name, TEAMS_SHORT_NAME_MAX, "name shown in the app list", warnings);
    const shortDescription = agent.description.length > TEAMS_SHORT_DESCRIPTION_MAX
        ? agent.description.slice(0, TEAMS_SHORT_DESCRIPTION_MAX).trim()
        : agent.description;

    const manifest = {
        version: teamsManifestVersion(),
        id: appId,
        developer: {
            name: developerName,
            websiteUrl: creator.website,
            privacyUrl: creator.privacy,
            termsOfUseUrl: creator.terms
        },
        name: { short: shortName, full: agent.name },
        description: { short: shortDescription, full: agent.description },
        icons: { outline: "outline.png", color: "color.png" },
        accentColor: TEAMS_ACCENT_COLOR,
        validDomains: TEAMS_VALID_DOMAINS.slice(),
        "$schema": TEAMS_MANIFEST_SCHEMA,
        manifestVersion: TEAMS_MANIFEST_VERSION,
        copilotAgents: {
            declarativeAgents: [{ id: appId, file: "declarativeAgent_0.json" }]
        }
    };

    const declarative = {
        version: DECLARATIVE_AGENT_VERSION,
        id: appId,
        name: agent.name,
        description: agent.description,
        instructions: agent.instructions
    };
    if (agent.starters.length > 0) {
        declarative.conversation_starters = agent.starters.map(function (text) { return { text: text }; });
    }
    const capabilities = [];
    COPILOT_CAPABILITIES.forEach(function (cap) {
        if (agent.copilot[cap.key]) {
            capabilities.push({ name: cap.name });
        }
    });
    if (agent.sharepointLinks.length > 0) {
        capabilities.push({
            name: "OneDriveAndSharePoint",
            items_by_url: agent.sharepointLinks.map(function (url) { return { url: url }; })
        });
    }
    if (capabilities.length > 0) {
        declarative.capabilities = capabilities;
    }
    if (agent.copilot.preferMyFiles) {
        declarative.behavior_overrides = { special_instructions: { discourage_model_knowledge: true } };
    }

    const entries = [
        { name: "manifest.json", bytes: toBytes(JSON.stringify(manifest, null, 2)) },
        { name: "declarativeAgent_0.json", bytes: toBytes(JSON.stringify(declarative, null, 2)) },
        { name: "color.png", bytes: icons.color },
        { name: "outline.png", bytes: icons.outline }
    ];
    return { fileName: safeFileName(agent.name + " Copilot app", ".zip"), bytes: zipWrite(entries), warnings: warnings, appId: appId };
}

/**
 * Reads a Teams app package made by the Copilot app or by this app.
 * @param {Uint8Array} bytes
 * @returns {Promise<{agent: object, notices: string[]}|{error: string}>}
 */
async function teamsZipImport(bytes) {
    const archive = await readArchiveForImport(bytes);
    if (archive.error) {
        return { error: archive.error };
    }
    const entries = archive.entries;
    const notices = [];
    const manifest = entries.has("manifest.json") ? parseJsonObject(fromBytes(entries.get("manifest.json"))) : null;
    let declarativeFile = readPath(manifest || {}, ["copilotAgents", "declarativeAgents", "0", "file"]);
    if (typeof declarativeFile !== "string" || !entries.has(declarativeFile)) {
        declarativeFile = "declarativeAgent_0.json";
    }
    if (!entries.has(declarativeFile)) {
        return { error: "This ZIP has no declarative agent file (declarativeAgent_0.json), so it isn't a Copilot app package." };
    }
    const declarative = parseJsonObject(fromBytes(entries.get(declarativeFile)));
    if (!declarative) {
        return { error: "The declarative agent file inside this ZIP is not valid JSON." };
    }
    const raw = {
        name: declarative.name,
        description: declarative.description,
        instructions: declarative.instructions,
        starters: (Array.isArray(declarative.conversation_starters) ? declarative.conversation_starters : [])
            .map(function (item) { return isPlainObject(item) ? item.text : ""; }),
        sharepointLinks: [],
        copilot: {
            webSearch: false,
            teamsMessages: false,
            meetings: false,
            codeInterpreter: false,
            imageGeneration: false,
            preferMyFiles: readPath(declarative, ["behavior_overrides", "special_instructions", "discourage_model_knowledge"]),
            appId: manifest ? manifest.id : ""
        },
        creator: {}
    };
    (Array.isArray(declarative.capabilities) ? declarative.capabilities : []).forEach(function (capability) {
        if (!isPlainObject(capability)) {
            return;
        }
        const known = COPILOT_CAPABILITIES.find(function (cap) { return cap.name === capability.name; });
        if (known) {
            raw.copilot[known.key] = true;
        } else if (capability.name === "OneDriveAndSharePoint") {
            (Array.isArray(capability.items_by_url) ? capability.items_by_url : []).forEach(function (item) {
                if (isPlainObject(item)) {
                    raw.sharepointLinks.push(item.url);
                }
            });
        } else if (typeof capability.name === "string") {
            notices.push("The capability \"" + capability.name + "\" is not one this app can carry and was left out.");
        }
    });
    if (Array.isArray(declarative.actions) && declarative.actions.length > 0) {
        notices.push("This package has " + declarative.actions.length + " action(s) (plugins) that this app can't carry. They were left out.");
    }
    const developer = manifest && isPlainObject(manifest.developer) ? manifest.developer : {};
    const developerFields = { name: "name", website: "websiteUrl", privacy: "privacyUrl", terms: "termsOfUseUrl" };
    Object.keys(developerFields).forEach(function (key) {
        const value = developer[developerFields[key]];
        raw.creator[key] = value === CREATOR_PLACEHOLDERS[key] ? "" : value;
    });
    const colorFile = readPath(manifest || {}, ["icons", "color"]);
    const iconBytes = entries.get(typeof colorFile === "string" ? colorFile : "color.png");
    raw.icon = iconFromBytes(iconBytes, notices);
    notices.push("Copilot app packages don't carry a welcome message, so that field is empty.");
    const result = normalizeAgent(raw);
    return { agent: result.agent, notices: notices.concat(result.notices) };
}

// ### Format: copy-ready text (ChatGPT and Gemini Notebook) ###

/**
 * Returns the fields a person pastes into the GPT builder or Notebook settings,
 * plus one Markdown document for adding to a notebook as a source.
 * @param {object} agent a normalized agent
 * @returns {{name: string, description: string, instructions: string, starters: string, markdown: string, fileName: string}}
 */
function copyTextExport(agent) {
    const lines = ["# " + agent.name, ""];
    if (agent.description) {
        lines.push(agent.description, "");
    }
    lines.push("## Instructions", "", agent.instructions, "");
    if (agent.starters.length > 0) {
        lines.push("## Conversation starters", "");
        agent.starters.forEach(function (text) { lines.push("- " + text); });
        lines.push("");
    }
    return {
        name: agent.name,
        description: agent.description,
        instructions: agent.instructions,
        starters: agent.starters.join("\n"),
        markdown: lines.join("\n"),
        fileName: safeFileName(toSkillName(agent.name), ".md")
    };
}

// ### Format detection ###

/**
 * Guesses which importer to use from the file name and the first bytes. The
 * importer still validates everything; this only picks which one to try.
 * @param {string} fileName
 * @param {Uint8Array} bytes
 * @returns {"bundle"|"skillMd"|"msAgent"|"teamsZip"|"unknown"}
 */
function detectFormat(fileName, bytes) {
    const lower = String(fileName || "").toLowerCase();
    const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(0);
    if (lower.endsWith(".agent")) {
        return "msAgent";
    }
    if (lower.endsWith(".md")) {
        return "skillMd";
    }
    if (data.length > 4 && data[0] === 0x50 && data[1] === 0x4B && data[2] === 0x03 && data[3] === 0x04) {
        const names = new TextDecoder("latin1").decode(data);
        if (names.indexOf("SKILL.md") >= 0) {
            return "bundle";
        }
        if (names.indexOf("manifest.json") >= 0 || names.indexOf("declarativeAgent") >= 0) {
            return "teamsZip";
        }
        return "unknown";
    }
    if (lower.endsWith(".json") && data.length < LIMITS.zipEntryBytes) {
        const text = fromBytes(data.subarray(0, 4096));
        if (text.indexOf("customCopilotConfig") >= 0 || text.indexOf("schemaVersion") >= 0) {
            return "msAgent";
        }
    }
    return "unknown";
}

// ### Public engine namespace ###
globalThis.Agentprise = {
    LIMITS: LIMITS,
    APP_VERSION: APP_VERSION,
    APP_SITE_URL: APP_SITE_URL,
    DEFAULT_LICENSE: DEFAULT_LICENSE,
    LICENSE_CHOICES: LICENSE_CHOICES,
    CREATOR_PLACEHOLDERS: CREATOR_PLACEHOLDERS,
    META: META,
    createAgent: createAgent,
    normalizeAgent: normalizeAgent,
    validateAgent: validateAgent,
    toSkillName: toSkillName,
    safeFileName: safeFileName,
    detectFormat: detectFormat,
    yaml: { parseFrontmatter: parseFrontmatter, stringifyFrontmatter: stringifyFrontmatter },
    zip: { read: zipRead, write: zipWrite, ZipError: ZipError },
    png: { dimensions: pngDimensions },
    bytes: { toBase64: bytesToBase64, fromBase64: base64ToBytes, equal: bytesEqual, toText: fromBytes, fromText: toBytes },
    formats: {
        bundle: { export: bundleExport, import: bundleImport },
        skillMd: { import: skillMdImport },
        msAgent: { export: msAgentExport, import: msAgentImport },
        teamsZip: { export: teamsZipExport, import: teamsZipImport },
        copyText: { export: copyTextExport }
    }
};

// ### Interface startup ###
// The engine above has no DOM dependency so the test suite can load it in Node.
// Everything that touches the page starts here and only in a browser.
if (typeof document !== "undefined" && document.getElementById) {
    // The interface is added in a later phase.
}
